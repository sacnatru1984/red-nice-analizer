    <rect x="28" y="64" width="44" height="6" rx="3" fill="#2563EB"/>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <meta name="ext-resource-dependency" content="./assets/fondo-red.jpg" data-resource-id="fondoRed" />
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./rango-medals.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
    body { font-family: 'Poppins', system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    :root {
      /* Estilo NICE: azul marino, índigo, verde suave, fondo gris claro */
      --nice-navy: #0F2341;
      --nice-navy2: #1C3050;
      --nice-indigo: #2B3A8F;
      --nice-tile: #EEF0FA;
      --nice-sand: #C9A86A;
      --nice-radius: 20px;
      --win-bg: #F4F5F9;
      --win-surface: #FFFFFF;
      --win-surface2: #F6F7FB;
      --win-border: #E5E8F0;
      --win-border2: #D5DAE5;
      --win-title: #0F2341;
      --win-text: #3B4256;
      --win-muted: #8A90A2;
      --win-accent: #2B3A8F;
      --win-accent-l: #EEF0FA;
      --win-green: #1E9E50;
      --win-green-l: #E6F6EC;
      --win-gold: #C47F17;
      --win-purple: #7C3AED;
      --win-red: #DC2626;
      --win-red-l: #FEF2F2;
      --win-cyan: #0E9BD6;
      --win-amber: #E08A2B;
      --win-link: #9FB6D8;
      --win-link-glow: none;
      --win-glow-cyan: rgba(56,198,244,.0);
      --shadow-md: 0 6px 22px rgba(15,35,65,.08);
      --win-tooltip-bg: #14213D;
      --win-tooltip-fg: #FFFFFF;
    }
    [data-theme="dark"] {
      /* Modo oscuro con el azul marino de la app NICE (#0B233F) */
      --nice-navy: #0B233F;
      --nice-navy2: #1D324D;
      --nice-indigo: #8EA0FF;
      --nice-tile: #263D5C;
      --win-bg: #0B233F;
      --win-surface: #1D324D;
      --win-surface2: #243B58;
      --win-border: #2F4766;
      --win-border2: #3D5677;
      --win-title: #FFFFFF;
      --win-text: #D7DFEB;
      --win-muted: #9AA9BF;
      --win-accent: #8EA0FF;
      --win-accent-l: #263D5C;
      --win-green: #4ADE80;
      --win-green-l: #173A33;
      --win-gold: #E8B54A;
      --win-purple: #B4A2FF;
      --win-red: #F87171;
      --win-red-l: #3A2230;
      --win-cyan: #5FD3F7;
      --win-amber: #F2A742;
      --win-link: #8EA0FF;
      --win-link-glow: none;
      --win-glow-cyan: rgba(95,211,247,.12);
      --shadow-md: 0 8px 24px rgba(0,0,0,.35);
      --win-tooltip-bg: #FFFFFF;
      --win-tooltip-fg: #0B233F;
    }
    body { background: var(--win-bg); }

    /* Capa atmosférica sutil (modo claro) */
    :root body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        none;
      pointer-events: none;
      z-index: 0;
    }

    /* Capa atmosférica de la red (solo modo oscuro) */
    [data-theme="dark"] body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        none;
      pointer-events: none;
      z-index: 0;
    }

    /* Pantalla de bienvenida full-bleed */
    .rn-welcome {
      position: relative;
      min-height: calc(100% + 40px);
      margin: -20px -24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      background: #081523;
    }
    .rn-welcome__bg {
      position: absolute;
      inset: 0;
      background-image: url('./assets/fondo-red.jpg');
      background-size: cover;
      background-position: center 35%;
      transform: scale(1.06);
      animation: rnDrift 26s ease-in-out infinite alternate;
    }
    .rn-welcome__scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 18%, rgba(8,21,35,.18) 0%, rgba(8,21,35,.62) 52%, rgba(8,21,35,.92) 100%),
        linear-gradient(180deg, rgba(8,21,35,.30) 0%, rgba(8,21,35,.55) 100%);
    }
    .rn-welcome__content { position: relative; z-index: 2; padding: 32px; max-width: 560px; }
    @keyframes rnDrift {
      from { transform: scale(1.06) translate3d(0,0,0); }
      to   { transform: scale(1.12) translate3d(-1.5%, -1.5%, 0); }
    }
    @keyframes rnspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .rn-welcome__bg { animation: none; }
    }

    .rn-glass-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 30px; border-radius: 12px;
      background: linear-gradient(180deg, #2E8FF0 0%, #1E6FE0 100%);
      color: #fff; font-size: 15px; font-weight: 600;
      font-family: inherit; border: 1px solid rgba(120,200,255,.5);
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(20,120,230,.45), inset 0 1px 0 rgba(255,255,255,.35);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .rn-glass-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(20,120,230,.55), inset 0 1px 0 rgba(255,255,255,.4); }
    .rn-ghost-btn {
      background: none; border: none; color: #BFE4FB; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; text-decoration: underline; text-underline-offset: 3px;
    }
    .rn-ghost-btn:hover { color: #fff; }

    /* Hero de bienvenida: logo a la izquierda, panel "Empieza aquí" a la derecha */
    .rn-wl {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr);
      gap: 48px; align-items: center;
      width: 100%; max-width: 1040px; padding: 40px 32px;
      text-align: left;
    }
    .rn-wl__brand { display: flex; flex-direction: column; align-items: flex-start; }
    .rn-logo-stage { position: relative; width: 100%; max-width: 460px; margin-bottom: 30px; }
    .rn-logo-stage__orbit {
      position: absolute; left: -6%; right: -6%; top: 50%; height: 78%;
      transform: translateY(-50%) rotate(-8deg);
      border: 1.5px solid rgba(79,208,245,.45); border-radius: 50%;
      box-shadow: 0 0 24px rgba(79,208,245,.25);
      pointer-events: none;
      animation: rnOrbit 9s ease-in-out infinite alternate;
    }
    .rn-logo-stage__orbit::after {
      content: ''; position: absolute; top: -5px; left: 18%;
      width: 9px; height: 9px; border-radius: 50%;
      background: #4FD0F5; box-shadow: 0 0 12px #4FD0F5, 0 0 24px rgba(79,208,245,.6);
    }
    .rn-logo-plate {
      position: relative;
      background: radial-gradient(120% 140% at 30% 20%, rgba(20,52,92,.72) 0%, rgba(6,16,30,.82) 100%);
      border: 1px solid rgba(120,200,255,.28);
      border-radius: 22px; padding: 18px 22px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 60px rgba(56,170,245,.25), inset 0 1px 0 rgba(160,220,255,.18);
    }
    .rn-logo-img { display: block; width: 100%; height: auto; }
    .rn-wl__title {
      font-size: 34px; font-weight: 700; color: #fff; line-height: 1.12;
      letter-spacing: -.02em; margin-bottom: 12px; text-shadow: 0 2px 30px rgba(0,0,0,.5);
    }
    .rn-wl__sub { font-size: 15px; line-height: 1.6; color: rgba(220,235,250,.82); max-width: 420px; }

    .rn-start {
      background: rgba(10,26,44,.62); border: 1px solid rgba(120,200,255,.22);
      border-radius: 20px; padding: 22px; backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
      display: flex; flex-direction: column; gap: 12px;
    }
    .rn-start__label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #BFE4FB; margin-bottom: 4px; }
    .rn-start__dot { width: 7px; height: 7px; border-radius: 50%; background: #4FD0F5; box-shadow: 0 0 10px #4FD0F5; }
    .rn-start__opt {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 14px 16px; border-radius: 14px; text-align: left;
      background: rgba(255,255,255,.05); border: 1px solid rgba(120,200,255,.25);
      color: #E6F2FD; font-family: inherit; cursor: pointer;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .rn-start__opt:hover:not(:disabled) { transform: translateY(-2px); background: rgba(255,255,255,.09); }
    .rn-start__opt--primary {
      background: linear-gradient(180deg, #2E8FF0 0%, #1E6FE0 100%); border-color: rgba(120,200,255,.5); color: #fff;
      box-shadow: 0 8px 28px rgba(20,120,230,.45), inset 0 1px 0 rgba(255,255,255,.35);
    }
    .rn-start__opt--primary:hover:not(:disabled) { background: linear-gradient(180deg, #3A98F4 0%, #2577E6 100%); }
    .rn-start__opt--ok { border-color: rgba(52,211,153,.5); }
    .rn-start__opt--off { cursor: not-allowed; opacity: .75; }
    .rn-start__opt--off .rn-start__ico { opacity: .4; }
    .rn-start__off-note {
      align-self: flex-start; margin-top: 6px; padding: 2px 8px; border-radius: 6px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: #FCA5A5; background: rgba(239,68,68,.16); border: 1px solid rgba(239,68,68,.45);
    }
    .rn-start__opt--ok .rn-start__d { color: #4ade80; opacity: 1; }
    .rn-start__num {
      flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
    }
    .rn-start__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
    .rn-start__t { font-size: 15px; font-weight: 700; }
    .rn-start__d { font-size: 11.5px; font-weight: 500; opacity: .8; margin-top: 2px; }
    .rn-start__ico { flex-shrink: 0; width: 18px; height: 18px; opacity: .9; }
    .rn-start__feats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 8px; padding-top: 14px; border-top: 1px solid rgba(120,200,255,.15);
    }
    .rn-start__feat { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: rgba(220,235,250,.88); }
    .rn-start__feat-ico { flex-shrink: 0; width: 14px; height: 14px; color: #4FD0F5; }
    @keyframes rnOrbit {
      from { transform: translateY(-50%) rotate(-8deg); }
      to   { transform: translateY(-50%) rotate(-3deg) scale(1.02); }
    }
    @media (prefers-reduced-motion: reduce) { .rn-logo-stage__orbit { animation: none; } }

    /* Pantalla de entrada (splash) con botón Acceder */
    .rn-splash {
      position: fixed; inset: 0; z-index: 1000;
      background: #04102A;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: max(6vh, 36px);
      padding: 24px;
      animation: rnSplashIn .5s ease both;
    }
    .rn-splash__bg {
      position: absolute; inset: 0;
      /* Fondo azul marino con planos diagonales, como la entrada de la app NICE */
      background:
        linear-gradient(118deg, transparent 62%, rgba(40,80,150,.22) 62%, rgba(40,80,150,.10) 100%),
        linear-gradient(200deg, rgba(40,80,150,.18) 0%, transparent 38%),
        radial-gradient(70% 50% at 50% 42%, rgba(56,140,240,.28), transparent 70%),
        linear-gradient(180deg, #0B1E3D 0%, #0A1730 100%);
    }
    .rn-splash__icon {
      position: relative; z-index: 1; display: block;
      width: min(300px, 62vw); height: auto;
      filter: drop-shadow(0 24px 50px rgba(0,0,0,.45)) drop-shadow(0 0 40px rgba(56,150,245,.25));
      animation: rnIconIn .6s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rnIconIn { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: none; } }
    .rn-splash__btn {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 14px;
      min-width: 280px; padding: 14px 34px; border-radius: 18px;
      background: #FFFFFF; border: none; color: var(--nice-navy);
      font-family: inherit; cursor: pointer;
      box-shadow: 0 18px 44px rgba(0,0,0,.35), 0 0 34px rgba(56,170,245,.25);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .rn-splash__btn:hover, .rn-splash__btn:focus-visible {
      transform: translateY(-2px); outline: none;
      box-shadow: 0 22px 50px rgba(0,0,0,.4), 0 0 46px rgba(79,208,245,.4);
    }
    .rn-splash__btn-ico { width: 26px; height: 26px; display: flex; color: var(--nice-navy); }
    .rn-splash__btn-txt { display: flex; flex-direction: column; align-items: flex-start; font-size: 20px; font-weight: 600; line-height: 1.15; }
    .rn-splash__btn-txt small { font-size: 12.5px; font-weight: 400; color: #6B7286; letter-spacing: .02em; }
    @keyframes rnSplashIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .rn-splash, .rn-splash__icon { animation: none; } }
    @media (max-width: 720px) {
      .rn-splash { gap: 44px; }
      .rn-splash__btn { min-width: 0; width: calc(100% - 64px); max-width: 320px; font-size: 17px; }
    }
    @media (max-width: 820px) {
      .rn-wl { grid-template-columns: 1fr; gap: 28px; padding: 28px 16px; text-align: center; }
      .rn-wl__brand { align-items: center; }
      .rn-logo-stage { max-width: 340px; margin-bottom: 22px; }
      .rn-logo-plate { padding: 16px 20px; border-radius: 18px; }
      .rn-wl__title { font-size: 26px; }
      .rn-wl__sub { font-size: 14px; }
      .rn-start { padding: 16px; text-align: left; }
      .rn-start__t { font-size: 14px; }
    }
    @media (max-width: 380px) { .rn-start__feats { grid-template-columns: 1fr; } }

    /* ── Mi Red: bienvenida estilo app NICE ── */
    .rn-welcomebar {
      position: relative; margin: -20px -24px 64px; padding: 26px 28px 0;
      background: linear-gradient(160deg, var(--nice-navy2) 0%, var(--nice-navy) 70%);
      border-radius: 0 0 36px 36px; color: #fff;
    }
    .rn-welcomebar__top { display: flex; align-items: center; gap: 18px; max-width: 1100px; margin: 0 auto; }
    .rn-welcomebar__medals { display: flex; gap: 14px; flex-shrink: 0; }
    .rn-welcomebar__medal { width: 108px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .rn-welcomebar__disc { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
    .rn-welcomebar__disc img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
    .rn-welcomebar__disc > span { width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #fff; }
    .rn-welcomebar__rank {
      margin-top: -12px; position: relative; display: inline-block; white-space: nowrap;
      padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; color: #fff;
      background: rgba(15,35,65,.85); border: 1px solid rgba(255,255,255,.4); backdrop-filter: blur(6px);
    }
    .rn-welcomebar__tipo { margin-top: 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.6); }
    .rn-welcomebar__info { min-width: 0; }
    .rn-welcomebar__hola { font-size: 28px; font-weight: 700; line-height: 1.15; }
    .rn-welcomebar__nombre { font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.88); margin-top: 2px; }
    .rn-welcomebar__chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .rn-welcomebar__chip { padding: 4px 12px; border-radius: 20px; font-size: 12.5px; color: rgba(255,255,255,.8); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); }
    .rn-welcomebar__chip b { color: #fff; font-weight: 700; letter-spacing: .03em; }
    .rn-welcomebar__sub { font-size: 13px; color: rgba(255,255,255,.65); margin-top: 8px; }
    .rn-welcomebar__head { max-width: 1100px; margin: 20px auto 12px; font-size: 18px; font-weight: 700; }
    .rn-welcomebar__head span { font-size: 13px; font-weight: 400; color: rgba(255,255,255,.7); margin-left: 8px; }
    .rn-sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 1100px; margin: 0 auto -48px; }
    .rn-sumcard {
      background: var(--win-surface); border-radius: var(--nice-radius); padding: 14px 10px 16px;
      box-shadow: 0 8px 24px rgba(15,35,65,.12); text-align: center; color: var(--win-title);
      display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid var(--win-border);
    }
    .rn-sumcard--btn { cursor: pointer; font-family: inherit; transition: transform .15s ease; }
    .rn-sumcard--btn:hover { transform: translateY(-2px); }
    .rn-sumcard__t { font-size: 14px; font-weight: 600; }
    .rn-sumcard__l { font-size: 12px; color: var(--win-muted); }
    .rn-sumcard__star { width: 92px; height: 92px; border-radius: 50%; background: #E3E6EE; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; color: var(--nice-navy); }
    /* En modo oscuro las tarjetas del resumen se quedan blancas, como en la app NICE */
    [data-theme="dark"] .rn-sumcard {
      --win-surface: #FFFFFF; --win-title: #0F2341; --win-muted: #7A8194; --win-border: #E5E8F0;
      --nice-tile: #EEF0FA; --nice-indigo: #2B3A8F; --win-green: #1E9E50; --win-green-l: #E6F6EC;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    [data-theme="dark"] .rn-welcomebar { background: linear-gradient(160deg, #163050 0%, #0F2846 70%); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    [data-theme="dark"] .rn-action { background: linear-gradient(135deg, #22395A, #1D324D); border: 1px solid #2F4766; }
    [data-theme="dark"] .rn-action__go { color: #0B233F; }
    .rn-sumcard__star span { width: 18px; height: 18px; display: flex; }
    .rn-sumcard__star b { font-size: 19px; }
    .rn-sumcard__star small { font-size: 10px; color: var(--win-muted); }
    .rn-pill { display: inline-block; padding: 4px 12px; border-radius: 10px; background: var(--win-green-l); color: var(--win-green); font-size: 14px; font-weight: 700; }
    .rn-pill--indigo { background: var(--nice-tile); color: var(--nice-indigo); font-size: 12.5px; }

    /* Tarjetas de acción azul marino con flecha blanca */
    .rn-actions-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .rn-action {
      display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
      padding: 18px 20px; border-radius: var(--nice-radius); border: none; cursor: pointer; font-family: inherit;
      background: linear-gradient(135deg, var(--nice-navy2), var(--nice-navy)); color: #fff;
      box-shadow: 0 8px 22px rgba(15,35,65,.18); transition: transform .15s ease, box-shadow .15s ease;
    }
    .rn-action:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,35,65,.24); }
    .rn-action__ico { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; padding: 12px; flex-shrink: 0; }
    .rn-action__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .rn-action__sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 2px; }
    .rn-action__t { font-size: 17px; font-weight: 600; }
    .rn-action__go { width: 40px; height: 40px; border-radius: 10px; background: #fff; color: var(--nice-navy); display: flex; align-items: center; justify-content: center; padding: 10px; flex-shrink: 0; }
    @media (max-width: 720px) {
      .rn-welcomebar { margin: -14px -14px 60px; padding: 20px 14px 0; border-radius: 0 0 30px 30px; }
      .rn-welcomebar__top { flex-direction: column; gap: 12px; text-align: center; }
      .rn-welcomebar__medals { justify-content: center; }
      .rn-welcomebar__medal { width: 100px; }
      .rn-welcomebar__disc { width: 88px; height: 88px; }
      .rn-welcomebar__rank { font-size: 10.5px; padding: 3px 8px; }
      .rn-welcomebar__hola { font-size: 22px; }
      .rn-welcomebar__nombre { font-size: 12.5px; }
      .rn-welcomebar__chips { justify-content: center; }
      .rn-welcomebar__chip { font-size: 11.5px; }
      .rn-welcomebar__sub { font-size: 12px; }
      .rn-welcomebar__head { font-size: 16px; }
      .rn-sumgrid { gap: 8px; }
      .rn-sumcard { padding: 12px 4px 14px; }
      .rn-sumcard__t { font-size: 12px; }
      .rn-sumcard .rn-pill { font-size: 12px; padding: 3px 8px; }
      .rn-sumcard__star { width: 74px; height: 74px; }
      .rn-actions-list { grid-template-columns: 1fr; }
      .rn-action__t { font-size: 16px; }
    }

    /* Ventana del cheque: 2 columnas en pantallas anchas */
    .rn-cheque-body { display: grid; grid-template-columns: minmax(0, 1fr); }
    .rn-cheque-col { min-width: 0; }
    .rn-cheque-col table { display: block; overflow-x: auto; }
    @media (min-width: 960px) {
      .rn-cheque-body { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
      .rn-cheque-col table { display: table; }
      .rn-cheque-col > :first-child { margin-top: 0 !important; }
    }

    /* ── Barra de navegación inferior (celular) — estilo app NICE ── */
    .rn-bnav {
      flex-shrink: 0; position: relative; z-index: 120;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--win-surface); border-top: 1px solid var(--win-border);
      border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(15,35,65,.08);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }
    .rn-bnav__item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer; font-family: inherit;
      color: #A3A8BA; padding: 4px 0;
    }
    .rn-bnav__ico { width: 24px; height: 24px; display: flex; }
    .rn-bnav__lbl { font-size: 11px; font-weight: 500; }
    .rn-bnav__item.is-active { color: var(--nice-navy); }
    [data-theme="dark"] .rn-bnav__item.is-active { color: #fff; }
    .rn-bnav__item.is-active .rn-bnav__lbl { font-weight: 700; }
    .rn-bnav__item.is-active .rn-bnav__ico svg { stroke-width: 2.6; }

    /* Hoja inferior "Más" (como el selector de la tienda NICE) */
    .rn-sheet { position: fixed; inset: 0; z-index: 900; background: rgba(15,23,40,.45); display: flex; align-items: flex-end; animation: rnFade .18s ease; }
    .rn-sheet__panel {
      width: 100%; background: var(--win-surface); border-radius: 26px 26px 0 0;
      padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px rgba(0,0,0,.2); animation: rnUp .22s ease;
    }
    .rn-sheet__grip { width: 44px; height: 5px; border-radius: 3px; background: #CBD0DC; margin: 0 auto 14px; }
    .rn-sheet__title { text-align: center; font-size: 19px; font-weight: 700; color: var(--win-title); margin-bottom: 14px; }
    .rn-sheet__row {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 12px 14px; margin-bottom: 10px; border-radius: 14px;
      background: var(--win-surface2); border: 1px solid var(--win-border);
      font-family: inherit; font-size: 14px; font-weight: 600; color: var(--win-title); cursor: pointer; text-align: left;
    }
    .rn-sheet__row.is-active { border-color: var(--nice-indigo); background: var(--nice-tile); }
    .rn-sheet__tile { width: 36px; height: 36px; border-radius: 10px; background: var(--nice-tile); color: var(--nice-indigo); display: flex; align-items: center; justify-content: center; padding: 9px; flex-shrink: 0; }
    .rn-sheet__chev { width: 16px; height: 16px; color: var(--win-muted); display: flex; }
    .rn-sheet__badge { background: var(--win-red); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 7px; }
    .rn-sheet__back { display: block; width: 100%; margin-top: 4px; padding: 10px; background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--win-text); cursor: pointer; }
    @keyframes rnFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rnUp { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .rn-sheet, .rn-sheet__panel { animation: none; } }

    /* Logo fijo en el encabezado de cada sección (centrado en escritorio, a la derecha en celular) */
    .rn-panel-head { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; }
    .rn-panel-head__info { flex: 1; min-width: 0; }
    .rn-head-logo {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: linear-gradient(160deg, #10284A 0%, #071426 100%);
      border: 1px solid rgba(120,200,255,.3); border-radius: 12px;
      padding: 4px 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.25), 0 0 22px rgba(56,170,245,.22);
      pointer-events: none;
    }
    .rn-head-logo img { display: block; height: 46px; width: auto; }
    @media (max-width: 720px) {
      .rn-head-logo { position: static; transform: none; order: 2; flex-shrink: 0; padding: 4px 8px; border-radius: 10px; }
      .rn-head-logo img { height: 30px; }
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--win-border2); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Layout helpers the ported app relies on */
    .rn-hero {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 24px;
      background: var(--win-surface);
      border: 1px solid var(--win-border);
      border-radius: 14px;
      padding: 22px 26px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
    }
    .rn-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .rn-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .rn-tabs { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1 1 0; min-width: 0; }
    .rn-tabs::-webkit-scrollbar { display: none; }
    .rn-taskbar { min-width: 0; }
    .rn-actions { flex-shrink: 0; }
    .rn-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .rn-body { padding: 20px 24px; overflow-x: hidden; }

    /* Asegurar que el shell quede sobre la capa atmosférica */
    .rn-taskbar, .rn-body { position: relative; z-index: 1; }

    @media (max-width: 900px) {
      .rn-hero { grid-template-columns: 1fr; gap: 16px; }
      .rn-stats-grid { grid-template-columns: repeat(2, 1fr); }
      .rn-twocol { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .rn-tab-label { display: none; }
      .rn-user-chip { display: none !important; }
      .rn-body { padding: 14px 14px 28px; }
      .rn-reemb { grid-template-columns: 1fr !important; }
      .rn-anuncios { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 480px) {
      .rn-stats-grid { grid-template-columns: 1fr; }
    }

    /* Slider arrastrable de "meta de puntos" (cheque simulado) */
    .rn-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 20px;
      background: transparent;
      cursor: pointer;
      margin: 0;
    }
    .rn-slider::-webkit-slider-runnable-track {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, var(--win-gold) 0%, var(--win-gold) calc(var(--rn-slider-pct, 0%)), var(--win-surface) calc(var(--rn-slider-pct, 0%)), var(--win-surface) 100%);
      border: 1px solid var(--win-border);
    }
    .rn-slider::-moz-range-track {
      height: 10px;
      border-radius: 5px;
      background: var(--win-surface);
      border: 1px solid var(--win-border);
    }
    .rn-slider::-moz-range-progress {
      height: 10px;
      border-radius: 5px 0 0 5px;
      background: var(--win-gold);
    }
    .rn-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--win-gold);
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
      margin-top: -6px;
      cursor: grab;
    }
    .rn-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--win-gold);
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
      cursor: grab;
    }
    .rn-slider:active::-webkit-slider-thumb { cursor: grabbing; }
    .rn-slider.rn-slider-full::-webkit-slider-thumb { border-color: var(--win-green); }
    .rn-slider.rn-slider-full::-moz-range-thumb { border-color: var(--win-green); }
    .rn-slider.rn-slider-full::-moz-range-progress { background: var(--win-green); }
  </style>
</helmet>

</div>
</x-dc>
